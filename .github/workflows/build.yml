name: Build CarsonLinux ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             bc             bison             build-essential             cpio             flex             grub-pc-bin             grub-efi-amd64-bin             grub2-common             libelf-dev             libssl-dev             mtools             xorriso             xz-utils

      - name: Build CarsonLinux ISO
        run: |
          chmod +x scripts/build-iso.sh
          ./scripts/build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: CarsonLinux-x86_64-ISO
          path: out/*.iso
          if-no-files-found: error
